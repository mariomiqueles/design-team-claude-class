name: Check Claude Updates

on:
  schedule:
    # Runs every day at 9am UTC (6am Chile time)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for Claude SDK updates
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/check-updates.mjs

      - name: Commit changelog if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/changelog.json
          git diff --staged --quiet || git commit -m "chore: update Claude changelog [skip ci]"
          git push
